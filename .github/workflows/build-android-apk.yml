name: Build Android APK for WortBrücke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. سحب ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. إعداد Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. التحقق من ملفات المشروع
        run: |
          echo "Checking project files..."
          ls -la
          test -f index.html || {
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          }

      - name: 5. إعداد ملفات الويب
        run: |
          mkdir -p www
          cp index.html www/index.html

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d css ]; then
            cp -r css www/
          fi

          if [ -d js ]; then
            cp -r js www/
          fi

      - name: 6. تثبيت Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: 7. إعداد Capacitor
        run: |
          npx cap init WortBrücke com.wortbruecke.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: 8. بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: WortBruecke-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
